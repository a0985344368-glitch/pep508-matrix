[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pep508-matrix"
version = "0.1.1"
description = "Offline observations of PEP 508 marker outcomes across literal CI matrices"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "pep508-matrix contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["packaging>=23", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["build>=1", "editables>=0.5", "hatchling>=1.27", "pytest>=8"]

[project.scripts]
pep508-matrix = "pep508_matrix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pep508_matrix"]

[tool.hatch.build]
exclude = ["/MANIFEST.sha256", "/VERIFICATION.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
